name: ah_scanner
description: "AH Scanner - scan, enhance, OCR and convert documents. By AH Creations."
publish_to: 'none'

version: 1.0.9+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  camera: ^0.11.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.5
  image: ^4.9.2
  path_provider: ^2.1.6
  pdf: ^3.13.0
  path: ^1.9.1
  share_plus: ^13.3.0
  mobile_scanner: ^7.4.0
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1
  opencv_dart: ^2.2.2
  open_filex: ^4.5.0
  archive: ^4.0.9
  uuid: ^4.5.1
  crypto: ^3.0.7
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  injectable_generator: ^3.1.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  # Adaptive icon (Android 8+): navy brand plate + logo inside the 66dp safe zone.
  adaptive_icon_background: "#002040"
  adaptive_icon_foreground: "assets/icon/ah_icon_foreground.png"
